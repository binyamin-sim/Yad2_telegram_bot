name: Yad2 Telegram Bot

on:
  schedule:
    # Every 2 hours, 08:00–00:00 Israel time (UTC+3) → 05:00–21:00 UTC
    - cron: "0 5,7,9,11,13,15,17,19,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Yad2 bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YAD2_COOKIE: ${{ secrets.YAD2_COOKIE }}
        run: python main.py

      - name: Commit sent_ads.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_ads.json
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update sent_ads.json"
            git push
          fi
